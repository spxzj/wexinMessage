[project]
name = "wechat-viral-writer"
version = "0.1.0"
description = "Analyze viral WeChat article structure and generate mimicked drafts with configurable LLM API keys"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wechat-writer = "wechat_writer.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
